[package]
name = "azteccraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
glam = { version = "=0.34.1", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "457a078809690994b22debdffb703ff36d3129df" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
